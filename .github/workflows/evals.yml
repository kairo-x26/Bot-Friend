name: Evals (LLM judge)

# Run before promoting a prompt or model change (PRD §18).
on:
  workflow_dispatch:
    inputs:
      model:
        description: Chat model to evaluate
        default: gpt-5-mini

jobs:
  full-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bot-friend/shared build && pnpm --filter @bot-friend/api build
      - name: Start API with OpenAI
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health/ready && break; sleep 1; done
        env:
          DATABASE_EMBEDDED: 'true'
          AUTH_DEV_LOGIN: 'true'
          AI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ inputs.model }}
          QUOTA_FREE_DAILY: '100000'
          RATE_LIMIT_MESSAGES_PER_MINUTE: '100000'
          RATE_LIMIT_AUTH_PER_MINUTE: '100000'
      - run: pnpm --filter @bot-friend/evals eval
        env:
          EVAL_BASE_URL: http://localhost:4000
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_CONCURRENCY: '3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/report-*.json
