services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botfriend
      POSTGRES_PASSWORD: botfriend
      POSTGRES_DB: botfriend
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botfriend']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
